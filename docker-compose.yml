services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      PRESENCE_ONLINE_THRESHOLD_SECONDS: ${PRESENCE_ONLINE_THRESHOLD_SECONDS:-300}
    volumes:
      # Bitácora de audio (ver docs/API.md, POST /api/audio-eventos): el
      # Dockerfile de backend copia el código en build (COPY app ./app), sin
      # volume mount — sin este volumen nombrado, cada rebuild/recreate del
      # contenedor borraría los clips guardados. Mismo criterio que
      # "db_data" para Postgres, acá aplicado a archivos en vez de una base.
      - audio_data:/app/storage/audio
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      # Sin curl en la imagen (python:3.12-slim) — se usa python mismo,
      # ya presente, en vez de agregar una dependencia nueva a la imagen
      # solo para el healthcheck. Necesario para que sdr-decoder pueda
      # esperar "service_healthy" (ver más abajo), no solo "backend arriba".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

  # sdr-decoder: captura y decodificación DMR/LRRP real (ver
  # docs/ARQUITECTURA.md secciones 2 y 9, docs/operacion-sdr.md).
  #
  # USB passthrough: NO se usa --privileged (investigado — expone todo el
  # host, riesgo innecesario para acceder a un solo dongle). Se hace
  # bind-mount de /dev/bus/usb completo (no de un nodo puntual) + un
  # device_cgroup_rules con wildcard sobre el major USB (189) — así, si el
  # dongle se desconecta/reconecta y el kernel le asigna un bus/device
  # nuevo, el contenedor lo sigue viendo sin necesitar un restart (a
  # diferencia de mapear un único /dev/bus/usb/BBB/DDD puntual, que se
  # rompe con el replug). El identificador ESTABLE para encontrar el
  # dongle correcto es igual el symlink de la regla udev del host
  # (/dev/sdr_bomberos, ver docs/ARQUITECTURA.md sección 9) — el bridge
  # sigue seleccionando el dispositivo por índice/serial de librtlsdr
  # (SDR_DEVICE_INDEX), no por el path host del symlink.
  #
  # Requisito de host (fuera del alcance de Docker): el driver DVB del
  # kernel y la regla udev del symlink tienen que estar resueltos ANTES de
  # levantar esto — ver sdr-decoder/check_sdr.sh.
  sdr-decoder:
    build: ./sdr-decoder
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # Logs crudos de dsd-fme por bloque (ver live_presence_bridge.py,
      # LOGS_DIR) — persistente entre recreaciones del contenedor, mismo
      # criterio que audio_data/db_data.
      - sdr_logs:/app/logs
    device_cgroup_rules:
      - "c 189:* rmw"
    environment:
      BACKEND_URL: http://backend:8000
      SDR_FRECUENCIA_HZ: ${SDR_FRECUENCIA_HZ:-159635000}
      SDR_GANANCIA: ${SDR_GANANCIA:-30}
      # Última calibración confirmada (ver docs/operacion-sdr.md) — deriva
      # con el tiempo, no asumir que sigue valiendo sin revisar.
      SDR_FREQ_CORR_HZ: ${SDR_FREQ_CORR_HZ:--7600}
      MALA_ANTENA_STD_UMBRAL: ${MALA_ANTENA_STD_UMBRAL:-1.5}
      VENTANA_SIN_DATOS_BLOQUES: ${VENTANA_SIN_DATOS_BLOQUES:-10}

volumes:
  db_data:
  audio_data:
  sdr_logs:

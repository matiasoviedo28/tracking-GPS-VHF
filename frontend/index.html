<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tracking-GPS-VHF — Bomberos Merlo</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <!-- Clustering de marcadores (ver app.js, grupoMarcadores) — evita que
       equipos con la misma posición exacta queden superpuestos e
       invisibles uno debajo del otro. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA="
    crossorigin=""
  />
  <!-- Solo la monoespaciada viene de CDN (radio_id/timestamps) — la sans
       general usa system-ui, sin depender de Google Fonts (ver style.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="status" class="status status--connecting">Conectando al backend…</div>

  <div id="panel-audio" class="panel panel-audio">
    <div class="panel-header">
      <h2>Bitácora de audio <span id="contador-audio" class="panel-contador">0</span></h2>
      <div class="switches-audio">
        <label class="switch" title="Al terminar un clip, arranca automáticamente el siguiente de la lista">
          <input type="checkbox" id="toggle-secuencial" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Reproducir en secuencia</span>
        </label>
        <label class="switch" title="Los clips nuevos que lleguen se reproducen solos, apenas llegan">
          <input type="checkbox" id="toggle-escuchar-vivo" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Escuchar en vivo</span>
        </label>
      </div>
    </div>
    <div class="panel-body">
      <ul id="lista-audio" class="lista-audio"></ul>
    </div>
  </div>

  <div id="panel-equipos" class="panel panel-equipos">
    <div class="panel-header">
      <h2>Equipos <span id="contador-equipos" class="panel-contador">0</span></h2>
      <div id="sdr-status-indicator" class="sdr-status-indicator sdr-status--sin_datos" title="Cargando estado del SDR…">
        <span class="sdr-status-dot"></span>
        <span class="sdr-status-texto">SDR</span>
      </div>
    </div>
    <div class="panel-body">
      <ul id="lista-equipos" class="lista-equipos"></ul>
    </div>
  </div>

  <div id="control-capas" class="panel panel-capas">
    <button type="button" class="capa-btn capa-btn--activo" data-capa="calle" title="Mapa de calles (OpenStreetMap)">🗺️ Calle</button>
    <button type="button" class="capa-btn" data-capa="satelite" title="Vista satelital (Esri)">🛰️ Satélite</button>
  </div>

  <!-- Control de trazados históricos (ver app.js, sección "Trazabilidad
       histórica"): selector de modo de color + leyenda de velocidad +
       avisos de muestreo. Oculto mientras no haya ningún trazado activo. -->
  <div id="panel-trazados" class="panel panel-trazados" hidden>
    <div class="panel-header">
      <h2>Trazados</h2>
    </div>
    <div class="panel-body">
      <div id="trazados-modo-selector" class="trazado-modo-selector">
        <button type="button" class="modo-btn modo-btn--activo" data-modo="equipo">Por equipo</button>
        <button type="button" class="modo-btn" data-modo="velocidad">Por velocidad</button>
      </div>
      <div id="trazados-modo-nota" class="trazado-modo-nota" hidden></div>
      <div id="trazados-leyenda-velocidad" class="trazado-leyenda" hidden>
        <div class="trazado-leyenda-titulo">Velocidad</div>
        <div class="trazado-leyenda-barra"></div>
        <div class="trazado-leyenda-valores">
          <span id="leyenda-vel-min">—</span>
          <span id="leyenda-vel-max">—</span>
        </div>
      </div>
      <ul id="trazados-avisos" class="trazados-avisos"></ul>
    </div>
  </div>

  <!-- Panel de filtros de rango de fechas para el trazado histórico (ver
       app.js): se abre al hacer click en un equipo del panel de Equipos que
       todavía no tiene trazado dibujado. -->
  <div id="modal-filtro-trazado" class="modal-overlay" hidden>
    <div class="modal-filtro-trazado">
      <div class="modal-filtro-header">
        <h3 id="filtro-trazado-titulo">Trazado histórico</h3>
        <button type="button" id="filtro-trazado-cerrar" class="modal-cerrar-btn" title="Cerrar y dibujar el trazado">✕</button>
      </div>
      <div class="modal-filtro-body">
        <div class="filtro-atajos">
          <button type="button" class="atajo-btn" data-atajo="1h">Última hora</button>
          <button type="button" class="atajo-btn atajo-btn--activo" data-atajo="24h">Últimas 24hs</button>
          <button type="button" class="atajo-btn" data-atajo="7d">Última semana</button>
          <button type="button" class="atajo-btn" data-atajo="30d">Último mes</button>
          <button type="button" class="atajo-btn" data-atajo="personalizado">Personalizado</button>
        </div>
        <div class="filtro-fechas">
          <label class="filtro-fecha-label">
            Desde
            <input type="datetime-local" id="filtro-desde" />
          </label>
          <label class="filtro-fecha-label">
            Hasta
            <input type="datetime-local" id="filtro-hasta" />
          </label>
        </div>
        <button type="button" id="filtro-limpiar" class="filtro-limpiar-btn">Limpiar filtros</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, el navegador puede cachear index.html/app.js/style.css por
    # tiempo indefinido (nginx no manda Cache-Control por default, solo
    # ETag/Last-Modified) — ya generó confusión más de una vez viendo un
    # index.html viejo junto a un app.js nuevo (o viceversa) después de un
    # rebuild. La app es chica y cambia seguido en esta etapa: priorizar
    # que cada deploy se vea al instante por sobre el ahorro de caché.
    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
    }
}
